# Publish site/ (built with the design system "Clear" from this repo) to GitHub Pages.
# One-time setup by a repo admin: Settings → Pages → Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "plugins/ai-design/skills/polish-ui/design/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Style check the page
        run: python3 plugins/ai-design/style/style_check.py site/index.html
      - name: Build
        run: site/build.sh
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
