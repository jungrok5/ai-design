# Rhetorical tells that three or more of these MIT/Apache-2.0 detectors list independently: blader/humanizer,
# hardikpandya/stop-slop, JMill/deslop, jdkato/voices, tbhb/vale-ai-tells, krishnasunkam/vale-ai-tells,
# sam-paech/slop-score, tnguyen21/slop-guard-rs, aaazzam/dslop. Kept only if they fired on at most 1 of 649
# human technical docs (docs/measurement.md). Patterns are ours.

[[rule]]
id = "en-its-not-x-its-y"
lang = "en"
severity = "warning"
pattern = "(?m)(?:^\\s*(?:[-*>]\\s+)?|(?<=[.!?]\\s))(?:(?:it|this|that)(?:['’]s| is) not|(?:it|this|that) isn['’]?t)\\b[^.!?\\n;]{1,60}?[,;:—–.]\\s*(?:it|this|that)(?:['’]s| is)\\b"
message = "'It's not X, it's Y' reframe"
suggest = "state what it is; drop the negation"

[[rule]]
id = "en-not-because"
lang = "en"
severity = "warning"
pattern = "\\bnot because\\b[^.!?\\n]{1,80}?(?:,\\s*but\\s+because\\b|[.;—–]\\s*(?:it['’]?s\\s+)?because\\b)"
message = "'not because X, but because Y' reversal"
suggest = "give the real reason once"

[[rule]]
id = "en-question-isnt-reframe"
lang = "en"
severity = "warning"
pattern = "\\bthe (?:real |actual )?(?:question|problem|issue|point|goal|challenge|answer) (?:is|was)(?:n['’]t| not)\\b[^.!?\\n]{1,60}[.,;—–]\\s*(?:it['’]?s|it is|the)\\b"
message = "'The problem isn't X, it's Y' reframe"
suggest = "say what the problem is"

[[rule]]
id = "en-negative-listing"
lang = "en"
severity = "warning"
pattern = '(?m)(?:^\s*(?:[-*>]\s+)?|(?<=[.!?]\s))(?:no|not (?:a|an|the)) [a-z-]+(?: [a-z-]+){0,2}[.,;]\s+(?:no|not (?:a|an|the)) \w'
message = "Negative listing ('No X. No Y.')"
suggest = "state what it is"

[[rule]]
id = "en-mic-drop-fragment"
lang = "en"
severity = "warning"
pattern = "\\bthat['’]?s (?:the whole|the entire|exactly the|the real|the only) (?:point|idea|thing|trick|story|job|argument|fix|premise|win|difference)\\b|\\bthat['’]?s it\\.\\s+that['’]?s\\b|[.!?]\\s+(?:full stop|period|every single time)\\.|\\bread that again\\b|\\blet me say that again\\b"
message = "Emphasis fragment"
suggest = "cut it, or add the missing fact"

[[rule]]
id = "en-rhetorical-self-answer"
lang = "en"
severity = "warning"
pattern = '(?m)(?:^\s*|(?<=[.!?]\s))the (?:result|outcome|answer|solution|catch|problem|issue|reason|reality|truth|worst part|best part|irony|twist|takeaway|lesson|upside|downside|difference|payoff)\?\s+\w'
message = "Self-answered question"
suggest = "state the answer as a sentence"

[[rule]]
id = "en-chatbot-signoff"
lang = "en"
severity = "warning"
pattern = "\\bfeel free to (?:ask|reach out|contact|let me know)\\b|\\bdon['’]?t hesitate to (?:ask|reach out|contact)\\b|\\bif you have any (?:other|further|additional|more) questions\\b|\\bis there anything else (?:i|we) (?:can|could)\\b|\\b(?:i['’]d|i would) be (?:happy|glad) to (?:help|assist)\\b|\\bhappy to help\\b|\\bhope (?:this|that) (?:clarifies|was helpful)\\b|\\bhopefully this helps\\b"
message = "Assistant sign-off"
suggest = "delete; end on the content"

[[rule]]
id = "en-ai-disclosure"
lang = "en"
severity = "warning"
pattern = "\\bas an ai\\b|\\bas a (?:large )?language model\\b|\\bup to my (?:last )?(?:knowledge|training)|\\bas of my (?:last |knowledge )?(?:cutoff|training)|\\bi (?:cannot|can['’]t) browse\\b|\\bi don['’]t have (?:personal|access to real-time)\\b|\\bi['’]m just an? ai\\b"
message = "AI disclosure residue"
suggest = "delete"

[[rule]]
id = "en-assistant-opener"
lang = "en"
severity = "warning"
pattern = "(?m)(?:^\\s*|(?<=[.!?]\\s))(?:absolutely|of course|sure thing)!|\\byou['’]re absolutely right\\b|\\b(?:excellent|fantastic|wonderful|insightful|thoughtful) question\\b|\\bthank you for (?:your|the) question\\b|\\bi['’]m glad you asked\\b|\\b(?:that['’]s|what) an? (?:great|excellent|fantastic|wonderful|interesting) (?:question|idea|point)\\b"
message = "Assistant opener"
suggest = "delete; start with the answer"

[[rule]]
id = "en-uncomfortable-truth"
lang = "en"
severity = "warning"
pattern = '\bthe (?:uncomfortable|inconvenient|unglamorous|unsexy|brutal|hard|awkward|dirty|hidden|unspoken|honest|simple) (?:truth|reality|secret)\b|\bthe (?:truth|reality) is(?:,| that\b)'
message = "Truth/reality announcement"
suggest = "state the fact"

[[rule]]
id = "en-performed-candor"
lang = "en"
severity = "warning"
pattern = "(?m)(?:^\\s*|(?<=[.!?]\\s))(?:honestly|frankly|candidly)\\s*[,?]|\\blet(?: me|['’]s) be (?:clear|honest|direct|blunt|frank|real)\\b|\\bi['’]ll be (?:honest|direct|blunt|frank)\\b|\\bto be (?:perfectly |brutally |completely |totally )?(?:honest|frank)\\b|\\bin all honesty\\b|\\bif i['’]m being (?:honest|frank)\\b|\\btruth be told\\b|\\breal talk\\b|\\bquite (?:frankly|honestly)\\b"
message = "Performed candor"
suggest = "cut; state the claim"

[[rule]]
id = "en-to-be-clear"
lang = "en"
severity = "warning"
pattern = '(?m)(?:^\s*|(?<=[.!?]\s))(?:and |but )?to be (?:clear|fair)\s*[,:]'
message = "'To be clear' frame"
suggest = "cut it; state the point"

[[rule]]
id = "en-heres-the-catch"
lang = "en"
severity = "warning"
pattern = "\\bhere['’]?s (?:the )?(?:catch|deal|kicker|truth|reality|secret|problem though|tension|tradeoff|trade-off)\\b|\\bhere['’]?s what (?:i mean|most people|nobody|no one|everyone|many|few)\\b|\\bhere['’]?s why (?:this|that|it) matters\\b|\\bhere['’]?s what i find\\b"
message = "Staged 'Here's…' reveal"
suggest = "cut; state the point"

[[rule]]
id = "en-nobody-talks-about"
lang = "en"
severity = "warning"
pattern = '\b(?:nobody|no one) (?:talks about|is talking about|tells you|mentions|discusses|wants to (?:admit|hear|say))\b|\bwhat (?:most people|everyone|nobody|no one) (?:get|gets|miss|misses|overlook|overlooks|tells you|forget|forgets) ?(?:wrong)?\b|\bthe part (?:nobody|no one|everyone|most people)\b|\bthe (?:dirty|open|unspoken) secret\b|\bthe elephant in the room\b|\bthe quiet part\b'
message = "False-exclusivity set-up"
suggest = "state the point"

[[rule]]
id = "en-narrative-pivot"
lang = "en"
severity = "warning"
pattern = "\\bthis is where (?:things|it) gets? (?:interesting|weird|tricky|complicated|messy|fun)\\b|\\bwhere (?:it|this|that|things) gets? (?:interesting|weird|tricky|spicy|hairy)\\b|\\bthen something (?:interesting|unexpected|strange) happened\\b|\\b(?:that|this) (?:changes|changed) everything\\b|\\bsomething (?:shifted|clicked|snapped)\\b|\\beverything (?:changed|shifted|clicked)\\b|\\bthat['’]s when everything changed\\b"
message = "Narrative pivot"
suggest = "state what happened"

[[rule]]
id = "en-urgency-inflation"
lang = "en"
severity = "warning"
pattern = "\\b(?:cannot|can['’]t) be (?:overstated|understated|overemphasi[sz]ed|emphasi[sz]ed enough)\\b|\\bmore (?:important|critical|relevant|urgent|essential|vital|pressing) than ever\\b|\\bhas never been more (?:important|critical|urgent|relevant|essential|vital)\\b|\\bthe stakes (?:have never been|are|couldn['’]t be) (?:higher|enormous|immense)\\b|\\bat a (?:crossroads|critical juncture|pivotal moment|defining moment)\\b|\\bin an (?:increasingly|ever more) [\\w-]+ world\\b"
message = "Urgency inflation"
suggest = "state the stakes with a number or consequence"

[[rule]]
id = "en-marks-a-turning-point"
lang = "en"
severity = "warning"
pattern = '\b(?:marks?|marked|marking) (?:a|an|the) (?:pivotal|significant|crucial|key|major|defining|turning|watershed|historic)\b|\b(?:turning point|watershed moment|sea change|tipping point|paradigm shift)\b|\bindelible (?:mark|impact)\b|\b(?:enduring|lasting) (?:legacy|impact)\b'
message = "Significance inflation"
suggest = "state what changed, with a date or number"

[[rule]]
id = "en-landscape-noun"
lang = "en"
severity = "warning"
pattern = '\b(?:evolving|competitive|digital|modern|business|technological|regulatory|shifting|changing|current|contemporary|rapidly changing) landscape\b|\blandscape of (?:the |modern |digital |technology|business|cloud|ai)'
message = "Abstract 'landscape'"
suggest = "name the actual field or market"

[[rule]]
id = "en-navigate-complexities"
lang = "en"
severity = "warning"
pattern = '\bnavigat(?:e|es|ed|ing) (?:the |this |these |an? )?(?:complexities|complexity|challenges|landscape|nuances|waters|maze|intricacies)\b'
message = "Figurative 'navigate'"
suggest = "say what the reader actually does"

[[rule]]
id = "en-vague-attribution"
lang = "en"
severity = "warning"
pattern = '\b(?:experts?|critics|observers|analysts|industry insiders) (?:argue|contend|warn|note|predict|claim|have (?:noted|argued|suggested|warned|cited))\b|\b(?:many|some) (?:people |experts |critics )?(?:believe|argue|would say|contend)\b|\bit is (?:widely|often|commonly|generally) (?:believed|said|thought|assumed)\b|\bwidely (?:regarded|recognized|recognised|considered|acknowledged) as\b|\b(?:studies|research|surveys|reports) (?:has |have )?(?:shown|indicated|demonstrated)\b'
message = "Vague attribution"
suggest = "name the source or cut the claim"

[[rule]]
id = "en-stark-reminder"
lang = "en"
severity = "warning"
pattern = '\b(?:serves?|served|serving) as (?:a|an) (?:stark |powerful |poignant |timely |sobering |vivid |potent )?(?:reminder|testament|beacon|cautionary tale)\b|\b(?:stark|sobering) reminder\b|\bcautionary tale\b'
message = "Reminder/testament inflation"
suggest = "state the fact"

[[rule]]
id = "en-plays-role"
lang = "en"
severity = "warning"
pattern = '\b(?:play|plays|played|playing) an? (?:crucial|pivotal|vital|significant|critical|instrumental|integral|central|key) role\b'
message = "'Plays a … role' inflation"
suggest = "say what it does"

# 1.6.0: more tells that three or more detectors list independently, adding giudegio-ai/claude-skill-humanizer,
# Aparnabuilds/humanizer, Kevjade/humanizer-pro, jpeggdev/humanize-writing, Aboudjem/humanizer-skill,
# lguz/humanize-writing-skill and Hainrixz/humanizalo (all MIT) to the sources above. Same bar: at most 1 of 499
# human train docs. Patterns are ours.

[[rule]]
id = "en-colon-reveal"
lang = "en"
severity = "warning"
pattern = '(?m)(?:^\s*|(?<=[.!?]\s))the (?:catch|kicker|upshot|payoff|twist|punchline|secret|takeaway|bottom line|irony|surprise|best part|worst part)\s*:\s|\bthe (?:answer|reason|problem|difference|catch|upshot|issue|question|point|trick|fix) is (?:simple|straightforward|this|obvious)\s*:|\b(?:comes?|boils?|boiled|came) down to (?:one|a single|this|two|three)(?: \w+)?\s*:'
message = "Colon reveal ('The best part: …', 'The answer is simple: …')"
suggest = "write it as a plain sentence"

[[rule]]
id = "en-false-agency"
lang = "en"
severity = "warning"
pattern = '\bthe (?:data|numbers|evidence|metrics|results) (?:tell|tells|show|shows|reveal|reveals) us\b|\bthe (?:culture|market|decision|conversation|complaint) (?:shifts|emerges|rewards|moves toward|becomes a fix)\b'
message = "False agency ('the data tells us', 'the market rewards')"
suggest = "name who decides or acts"

[[rule]]
id = "en-buzz-metaphor"
lang = "en"
severity = "warning"
pattern = '\bvirtuous (?:cycle|circle)\b|\b(?:growth|data|content|virtuous|self-?reinforcing) flywheel\b|\bflywheel effect\b|\b(?:competitive|economic|defensible|durable) moats?\b|\b(?:our|your|a|their) north star\b|\bnorth[- ]star metric\b|\bharness(?:es|ed|ing)? the (?:full )?(?:power|potential|capabilities)\b|\bthought[- ]leader(?:s|ship)?\b|\bresonat(?:e|es|ed|ing) (?:deeply |strongly )?with\b|\bpoised (?:to|for)\b'
message = "Strategy-deck metaphor or buzz phrase (flywheel, north star, harness the power, resonates with, poised to)"
suggest = "say the literal mechanism or effect"

[[rule]]
id = "en-meaning-telling"
lang = "en"
severity = "warning"
pattern = '\breflect(?:s|ed|ing)? (?:a |the )?(?:broader|larger|wider) (?:trends?|shifts?|movements?|patterns?)\b|\brepresents? (?:a |the )?(?:broader|larger|fundamental|major|significant) shift\b|\bdeeply rooted\b|\bthe (?:implications|stakes|consequences|reasons|results|costs|risks|challenges|reality) (?:are|is) (?:significant|high|real|clear|profound|enormous|structural|substantial|serious|staggering|far-reaching)\b'
message = "Meaning-telling ('reflects broader trends', 'represents a fundamental shift', 'the stakes are high')"
suggest = "state the fact and let the reader judge it"

[[rule]]
id = "en-hollow-phrase"
lang = "en"
severity = "warning"
pattern = '\bat the end of the day\b|\bwhen all is said and done\b|\bthe bottom line is\b|\bat (?:its|their) core\b|\bonly time will tell\b|\bit remains to be seen\b|\bexciting times (?:lie|are) ahead\b|\bthe future is bright\b'
message = "Hollow stock phrase ('at the end of the day', 'at its core', 'only time will tell')"
suggest = "cut it and keep the claim"

[[rule]]
id = "en-misconception-frame"
lang = "en"
severity = "warning"
pattern = '\bcontrary to (?:popular|common) (?:belief|opinion|wisdom)\b|\bconventional wisdom (?:says|holds|suggests|tells us)\b|\bmost people (?:think|assume|believe)\b|\bmany (?:people )?assume\b'
message = "Misconception set-up ('Contrary to popular belief', 'Most people think')"
suggest = "state the claim; cite the misconception only if it is documented"

[[rule]]
id = "en-false-concession"
lang = "en"
severity = "warning"
pattern = '\bwhile [^.,;!?\n]{1,50}? (?:is|are|may be|seems?) (?:impressive|promising|exciting|powerful|useful|valuable)[^.;!?\n]{0,5}, [^.;!?\n]{1,60}? remains? (?:a |an )?(?:challenge|concern|hurdle|open question|problem)\b|\b(?:is|are) not without (?:its |their )?(?:challenges|drawbacks|limitations|flaws|critics)\b'
message = "False concession ('While X is impressive, Y remains a challenge')"
suggest = "name what is impressive and what the challenge is, or pick a side"

[[rule]]
id = "en-speculative-gap"
lang = "en"
severity = "warning"
pattern = '\bwhile (?:specific )?details (?:are|remain) (?:limited|scarce)\b|\bbased on (?:the )?available information\b|\bspecific details (?:are|remain) (?:limited|scarce|unavailable)\b'
message = "Limited-information hedge ('while specific details are limited')"
suggest = "find the source or cut the sentence"

[[rule]]
id = "en-whether-youre"
lang = "en"
severity = "warning"
pattern = "\\bwhether you['’]re (?:a|an|just) [^.,;!?\\n]{1,40}? or (?:a |an |just )?[^.,;!?\\n]{1,40}"
message = "False-breadth opener ('Whether you're a beginner or an expert')"
suggest = "name the actual reader"

[[rule]]
id = "en-promo-phrases"
lang = "en"
severity = "warning"
pattern = '\bnestled (?:in|among|within|between)\b|\bin the heart of\b|\brenowned for\b|\bbreathtaking\b|\bmust-visit\b|\bstunning (?:array|views?|collection)\b|\brich (?:history|heritage)\b|\bvibrant community\b'
message = "Brochure phrase ('nestled in', 'in the heart of', 'renowned for')"
suggest = "give a checkable detail"

[[rule]]
id = "en-wh-cleft-opener"
lang = "en"
severity = "warning"
pattern = '(?m)(?:^\s*|(?<=[.!?]\s))what (?:makes|made) (?:this|it|that|them) (?:work|special|different|unique|powerful|possible)\b[^.!?\n]{0,30}\b(?:is|was)\b'
message = "Wh-cleft opener ('What makes this work is …')"
suggest = "start from the real subject (The cache makes this work)"

[[rule]]
id = "en-what-if-i-told-you"
lang = "en"
severity = "warning"
pattern = '\bwhat if i told you\b'
message = "Rhetorical set-up ('What if I told you …')"
suggest = "make the claim directly"

[[rule]]
id = "en-in-an-era"
lang = "en"
severity = "warning"
pattern = '\bin (?:an|this) era (?:of|where|when|in which)\b|\bin the age of\b'
message = "Era framing ('In an era of …')"
suggest = "start with the specific context or cut"

[[rule]]
id = "dash-overuse"
lang = "any"
severity = "warning"
pattern = '(?<!\|) [—–] (?!\|)'  # a dash alone in a table cell means "none" and is fine
message = "Em/en dash used as punctuation"
suggest = "쉼표, 콜론, 괄호 / comma, colon, parentheses"
max_per_file = 4
max_per_1k = 8  # 1.5.1: human English docs 23% -> 3%, Korean 5% -> 2%

# ───────────────────────── UI markup (HTML/CSS/JSX/TSX) ─────────────────────────

[[rule]]
id = "ui-default-accent"
kind = "markup"
severity = "warning"
pattern = '\b(?:text|bg|border|ring|outline|decoration|fill|stroke|accent)-(?:indigo|violet|purple)-\d{2,3}\b'
message = "Tailwind indigo/violet used as the accent (the AI default)"
suggest = "the product's accent token"

[[rule]]
id = "ui-purple-gradient"
kind = "markup"
severity = "error"
pattern = '(from|via|to)-(indigo|violet|purple|fuchsia)-\d{3}|linear-gradient\([^)]*(#6366f1|#8b5cf6|#a855f7|#7c3aed|#4f46e5|indigo|violet|purple)'
message = "AI default purple/indigo gradient"
suggest = "use the product's color tokens; solid surfaces"

[[rule]]
id = "ui-gradient-text"
kind = "markup"
severity = "error"
pattern = 'bg-clip-text[^"\x27]*text-transparent|text-transparent[^"\x27]*bg-clip-text|background-clip:\s*text|-webkit-background-clip:\s*text'
message = "Gradient-filled text"
suggest = "one solid color; emphasize with size or weight"

[[rule]]
id = "ui-emoji-heading"
kind = "markup"
severity = "error"
pattern = '<(h[1-6]|button|a|li)\b[^>]*>\s*(?P<hit>[\U0001F300-\U0001FAFF✨⭐])'
message = "Emoji used as an icon in a heading, button, link or list item"
suggest = "SVG icon with aria-hidden, or nothing"

[[rule]]
id = "ui-fake-social-proof"
kind = "markup"
severity = "error"
pattern = '★★★★★|Trusted by\s+[\d,]+\+|\b(John Doe|Jane Doe|Acme Corp)\b|lorem ipsum'
message = "Placeholder or invented social proof"
suggest = "real quotes, logos and numbers only"

[[rule]]
id = "ui-no-zoom"
kind = "markup"
severity = "error"
pattern = 'user-scalable\s*=\s*(no|0)|maximum-scale\s*=\s*1(\.0)?\b'
message = "Pinch zoom disabled"
suggest = "remove; zoom is an accessibility need"

[[rule]]
id = "ui-outline-none"
kind = "markup"
severity = "warning"
pattern = 'outline-none|outline:\s*(none|0)\b'
message = "Focus outline removed"
suggest = "keep a visible :focus-visible style (2px ring with 3:1 contrast)"

[[rule]]
id = "ui-glass"
kind = "markup"
severity = "warning"
pattern = 'backdrop-blur|backdrop-filter:\s*blur'
message = "Glass blur used as decoration"
suggest = "only for real overlays (sticky nav, modal)"
max_per_file = 1

[[rule]]
id = "ui-glow"
kind = "markup"
severity = "warning"
pattern = 'shadow-\[0_0_\d+px|drop-shadow-\[[^\]]*(purple|indigo|cyan)|box-shadow:\s*0\s+0\s+\d{2,}px'
message = "Colored glow / halo"
suggest = "remove; use contrast and spacing"

[[rule]]
id = "ui-bounce"
kind = "markup"
severity = "warning"
pattern = 'animate-(bounce|ping)|cubic-bezier\([^)]*,\s*1\.[2-9]'
message = "Bounce / pulsing animation"
suggest = "ease-out 150–250 ms, and only where it explains a change"

[[rule]]
id = "ui-transition-all"
kind = "markup"
severity = "warning"
pattern = 'transition-all|transition:\s*all\b'
message = "transition: all"
suggest = "list the properties (opacity, transform)"

[[rule]]
id = "ui-hero-pill"
kind = "markup"
severity = "warning"
pattern = 'rounded-full[^>]*>\s*(New|Beta|Introducing|Now in beta|✨|NEW)'
message = "'New ✨' pill above a headline"
suggest = "put news in a changelog or banner"

[[rule]]
id = "ui-eyebrow-caps"
kind = "markup"
severity = "warning"
pattern = 'uppercase[^"\x27]*tracking-(wide|wider|widest)|text-transform:\s*uppercase'
message = "All-caps eyebrow labels"
suggest = "fold the label into the heading or remove it"
max_per_file = 2

[[rule]]
id = "ui-card-radius"
kind = "markup"
severity = "warning"
pattern = 'rounded-(2xl|3xl)|border-radius:\s*(1[6-9]|[2-9]\d)px'
message = "Large radius on everything (card kit)"
suggest = "a radius scale by size; 0–8 px for docs and dashboards"
max_per_file = 3

[[rule]]
id = "ui-arrow-chrome"
kind = "markup"
severity = "warning"
pattern = '→\s*</(a|button)>'
message = "Arrow appended to every link or button"
suggest = "a verb label that says what happens (API 키 발급)"
max_per_file = 2

[[rule]]
id = "ui-default-font"
kind = "markup"
severity = "warning"
pattern = 'font-family:\s*["\x27]?(Inter|Geist|Poppins)\b|next/font/google[^;]*\b(Inter|Poppins)\b'
message = "Default AI font choice"
suggest = "font-family: var(--font-sans) from the design tokens"

[[rule]]
id = "ui-raw-color"
kind = "markup"
severity = "warning"
pattern = '(?<![\w-])(?:color|background(?:-color)?|border(?:-(?:top|right|bottom|left))?(?:-color)?|outline(?:-color)?|fill|stroke|box-shadow|text-decoration-color|caret-color|accent-color)\s*:\s*[^;{}"\n]*?(?:#[0-9a-fA-F]{3,8}\b|\brgba?\(|\bhsla?\()|\b(?:bg|text|border|fill|stroke|ring|from|via|to)-\[#[0-9a-fA-F]{3,8}\]'
message = "Raw color outside the design tokens"
suggest = "var(--token) from the design system (default: polish-ui/design/tokens.css in ai-design); add a token if none fits"

[[rule]]
id = "ui-raw-font"
kind = "markup"
severity = "warning"
# Inside an ordinary CSS block or a style attribute only. In an @font-face block, font-family names the face being
# declared, which is how a token's font gets loaded, so it is not a raw stack.
pattern = '(?:(?<!@font-face)(?<!@font-face )\{[^{}]*?|\bstyle\s*=\s*["\x27][^"\x27]*?)(?<![\w-])(?P<hit>font-family\s*:\s*(?!\s*(?:var\(|inherit|initial|unset)))'
message = "Font stack outside the design tokens"
suggest = "font-family: var(--font-sans) or var(--font-mono)"

[[rule]]
id = "ui-section-number"
kind = "markup"
severity = "warning"
pattern = '<(span|div|p|small|b|strong|em|i)\b[^>]*>\s*0[1-9]\.?\s*</\1>|<(span|div)\b[^>]*class="(num|number|index|n)"[^>]*>\s*\d{1,2}\.?\s*</\2>'
message = "순서가 아닌 절·항목에 붙인 번호 (01, 02 …)"
suggest = "번호 삭제, 실제 순서면 ds-steps 사용"
max_per_file = 2

[[rule]]
id = "ui-table-min-width"
kind = "markup"
severity = "warning"
pattern = 'table[^{}]*\{[^}]*min-width:\s*([4-9]\d{2}|\d{4,})px'
message = "Table with a fixed min-width wider than a phone screen"
suggest = "turn a two-column table into a list (<dl>), or let it wrap; never wider than 375 px by force"
