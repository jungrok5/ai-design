# ai-design style rules: the AI tone in prose and the AI look in UI code.
# Standard and reasoning: docs/standard.md (github.com/jungrok5/ai-design). Engine: style_check.py (stdlib only).
#
# severity: error   = almost always wrong in product copy and docs; CI fails on it
#           warning = often wrong; the hook shows it to the agent, CI only reports it
#           off     = disabled (use in a repo's .style/rules.toml to turn a rule off)
# kind:     prose   = text a person reads (Markdown outside code, HTML text)
#           markup  = raw HTML/CSS/JSX/TSX/Vue/Svelte source
#           register= Korean speech level mixing (합니다체 vs 해요체) in one file
# max_per_file: report only when the pattern occurs more often than this in one file.
# max_per_1k:   and more often than this per 1,000 words (English words, Korean eojeol), so long files are not
#               flagged just for being long.
#
# Pattern ideas are adapted from MIT/Apache-2.0 sources (blader/humanizer, epoko77-ai/im-not-ai,
# DaleSeo/korean-skills, vercel-labs/writing-guidelines and web-interface-guidelines, anthropics/skills
# frontend-design, pbakaus/impeccable) and paraphrased from Wikipedia "Signs of AI writing" (CC BY-SA)
# and the Toss technical-writing guide (CC BY-NC-SA). See ../THIRD_PARTY_NOTICES.md. Wording is ours.

# ───────────────────────── Korean prose ─────────────────────────

[[rule]]
id = "ko-hype"
lang = "ko"
severity = "error"
pattern = '(혁신|획기|압도|파격|폭발|대대|가히\s?혁명)적|전례\s?없는|막강한|게임\s?체인저|차세대\s?(솔루션|플랫폼|기술)'
message = "근거 없는 과장 수식어"
suggest = "무엇이 얼마나 나아지는지 숫자나 동작으로 서술 (예: 응답 1 ms 이하)"

[[rule]]
id = "ko-ai-boilerplate"
lang = "ko"
severity = "error"
pattern = '강력한\s*(AI|인공지능|기능|성능)|AI\s?기반의?\s*(강력|혁신|스마트|지능형)|스마트한\s?(솔루션|경험)|새로운\s?패러다임'
message = "AI가 자주 쓰는 상투 문구"
suggest = "제품이 실제로 하는 일로 교체"

[[rule]]
id = "ko-closing-formula"
lang = "ko"
severity = "error"
pattern = '결론적으로|요약하자면|정리하자면|종합하자면|종합적으로\s?볼\s?때'
message = "결말 공식"
suggest = "요약 접속어 삭제, 마지막 사실로 마무리"

[[rule]]
id = "ko-inflation"
lang = "ko"
severity = "error"
pattern = '시사하는\s?바가\s?(크|큽|커)|주목할\s?만하|간과할\s?수\s?없|지평을\s?(열|넓)|새로운\s?장을\s?열|시대가\s?도래|패러다임\s?전환|중요한\s?이정표'
message = "의미 부풀리기"
suggest = "삭제 또는 구체적인 결과(날짜, 수치)로 교체"

[[rule]]
id = "ko-question-heading"
lang = "ko"
severity = "warning"
pattern = '(?m)^#{1,6}\s(?!\[)[^\n]*[가-힣][^\n]*(\?|인가|일까|할까)\s*$'
message = "질문형 제목 (FAQ가 아닌 절)"
suggest = "그 절이 말하는 사실을 제목으로 (예: '얼마나 빨라졌나요?' → '배포 시간')"

[[rule]]
id = "ko-slogan"
lang = "ko"
severity = "warning"
pattern = '(?:이)?면\s?(?:끝|충분|그만|OK)(?:입니다|이에요|이다)?[.!]?(?=\s|$)'
message = "슬로건형 끝맺음 ('~면 끝')"
suggest = "주어와 동사가 있는 문장 (예: '명령 하나로 배포합니다')"

[[rule]]
id = "ko-cta-now"
lang = "ko"
severity = "warning"
pattern = '지금\s?(?:바로\s?)?[가-힣]+\s?(?:보세요|하세요)'
message = "재촉하는 행동 유도 문구"
suggest = "버튼과 링크는 누르면 일어나는 일 (예: 'shipit 설치')"

[[rule]]
id = "ko-now-is-the-time"
lang = "ko"
severity = "error"
pattern = '지금이야말로|할\s?때입니다|할\s?때예요|할\s?시점입니다'
message = "선동형 결말"
suggest = "지금 하면 달라지는 점을 서술"

[[rule]]
id = "ko-double-passive"
lang = "ko"
severity = "error"
pattern = '되어(지|집|진|져|졌)|지게\s?(됩니다|돼요|된다)'
message = "이중 피동, 또는 '~지게 됩니다' 우회"
suggest = "됩니다 / 누가 하는지 주어 명시"

[[rule]]
id = "ko-ni-isseoseo"
lang = "ko"
severity = "error"
pattern = '(?<![안속위밑곳뒤앞옆치래부])에\s?있어서?\s'  # "파일 안에 / 위치에 / 인터페이스 뒤에 있어"(=because it is in) is fine
message = "번역투 '~에 있어(서)'"
suggest = "~에서, ~할 때"

[[rule]]
id = "ko-chatbot-residue"
lang = "ko"
severity = "error"
pattern = '도움이\s?되(셨|었)(길|으면)|궁금한\s?점이\s?있으시면\s?언제든|좋은\s?질문|물론입니다!'
message = "챗봇 말투가 남음"
suggest = "삭제"

# The next four were found by comparing Claude-written Korean docs with human docs on the same 178 topics
# (docs/measurement.md, "AI 글과 사람 글 비교"). Held-out test: 26% of AI docs vs 1.4% of human docs hit any of them.

[[rule]]
id = "ko-advise"
lang = "ko"
severity = "warning"
pattern = '(기를|길|시길|는\s?것을|는\s?걸)\s?권(합니다|해요|해\s?드립니다)'  # not 권장/추천: normal in technical docs
message = "조언하는 말투 ('~하시길 권합니다')"
suggest = "할 일과 이유를 바로 서술 (예: 베타에서 먼저 빌드합니다. 정식판에서 API가 바뀝니다)"

[[rule]]
id = "ko-template-heading"
lang = "ko"
severity = "warning"
pattern = '(?m)^#{1,6}\s[^\n]*(체크리스트|체크\s?포인트|핵심\s?포인트|핵심\s?정리|한눈에\s?(보기|정리))\s*$'
message = "틀에 박힌 절 제목 (체크리스트, 핵심 포인트, 핵심 정리)"
suggest = "그 절이 실제로 담은 내용을 제목으로 (예: '체크리스트' → '배포 전 확인할 설정')"

[[rule]]
id = "ko-count-runup"
lang = "ko"
severity = "warning"
pattern = '[은는]\s(다음\s)?(두|세|네|다섯|여섯)\s?가지(입니다|예요|이다)'
message = "개수를 먼저 예고하는 도입 ('변경은 세 가지입니다')"
suggest = "예고 없이 목록이나 첫 항목으로 시작"

[[rule]]
id = "ko-hedged-advice"
lang = "ko"
severity = "warning"
pattern = '(편이|것이)\s?(안전|낫|바람직)(합니다|습니다|해요|다)|두는\s?(것이|편이)\s?좋(습니다|아요)'
message = "에둘러 권하는 말투 ('~하는 편이 안전합니다')"
suggest = "조건과 결과를 서술 (예: CI에서 먼저 돌리지 않으면 strict 오류가 배포 후에 드러납니다)"

[[rule]]
id = "ko-must-important"
lang = "ko"
severity = "warning"
pattern = '것이\s?(중요|필수|핵심)(합니다|해요|하다|적)'
message = "'~하는 것이 중요합니다'"
suggest = "해야 할 일을 바로 서술 (예: 매일 백업합니다)"

[[rule]]
id = "ko-tonghae"
lang = "ko"
severity = "warning"
pattern = '(을|를)\s?통(해|하여|한)\s'
message = "번역투 '~을 통해'"
suggest = "~로, ~에서"
max_per_file = 2

[[rule]]
id = "ko-daehae"
lang = "ko"
severity = "warning"
pattern = '에\s?대(해서?|하여)\s'
message = "번역투 '~에 대해'"
suggest = "목적어로 바로 연결 (미래에 대해 분석 → 미래를 분석)"
max_per_file = 3

[[rule]]
id = "ko-gajigo-itda"
lang = "ko"
severity = "warning"
pattern = '을\s?가지고\s?있|를\s?가지고\s?있'
message = "번역투 '~을 가지고 있다'"
suggest = "성능이 높습니다 / ~이 있습니다"

[[rule]]
id = "ko-uihae"
lang = "ko"
severity = "warning"
pattern = '에\s?의(해|하여|한)\s'
message = "피동 '~에 의해'"
suggest = "주어를 앞으로 (팀이 개발했습니다)"

[[rule]]
id = "ko-related-based"
lang = "ko"
severity = "warning"
pattern = '와\s?관련(하여|된)|과\s?관련(하여|된)|에\s?기반(하여|한)|라는\s?점에서'
message = "번역투 연결어"
suggest = "~의, ~로, ~에서"
max_per_file = 2

[[rule]]
id = "ko-cleft"
lang = "ko"
severity = "warning"
pattern = '(중요한|필요한)\s?것은|핵심은\s|관건은\s'
message = "'중요한 것은 X이다' 구문"
suggest = "X를 주어로 바로 서술"

[[rule]]
id = "ko-vague-praise"
lang = "ko"
severity = "warning"
pattern = '다양한|효과적(인|으로)|원활(한|하게)|최적의|효율적(인|으로)|손쉽게|간편하게|완벽(한|하게)|스마트한'
message = "모호한 칭찬 어휘"
suggest = "개수와 속도를 숫자로 서술"
max_per_file = 2

[[rule]]
id = "ko-noun-verb"
lang = "ko"
severity = "warning"
pattern = '(작업|처리|검토|확인|배포|설치)(을|를)\s?(수행|진행|실시)'
message = "명사 + 수행/진행/실시"
suggest = "동사로 (삭제 작업을 수행합니다 → 삭제합니다)"

[[rule]]
id = "ko-metadiscourse"
lang = "ko"
severity = "warning"
pattern = '알아보(겠|도록)|살펴보(겠|도록)|아시다시피|앞서\s?(설명|말)(했|한)|이번\s?(글|문서)에서는'
message = "글에 대한 글"
suggest = "지우고 바로 내용으로"

[[rule]]
id = "ko-hedge-stack"
lang = "ko"
severity = "warning"
pattern = '것으로\s?(보입니다|보여요|예상됩니다|판단됩니다)|수\s?있을\s?것으로'
message = "겹친 추측 표현"
suggest = "확인한 사실은 단정, 모르는 것은 모른다고 명시"

[[rule]]
id = "ko-not-but"
lang = "ko"
severity = "warning"
pattern = '단순(히|한)\s?\S+(을|를)?\s?넘어|뿐만\s?아니라'
message = "'단순한 X를 넘어 / ~뿐만 아니라' 대구"
suggest = "할 수 있는 일만 나열"
max_per_file = 1

[[rule]]
id = "ko-connective-comma"
lang = "ko"
severity = "warning"
pattern = '(하|되|있|없|이|았|었|였|르|많|크|작|빠르|쉽)(고|며|면서|지만|는데|어서|아서),\s'
message = "연결어미 뒤 쉼표"
suggest = "쉼표 삭제 또는 문장 분리"
max_per_file = 3

[[rule]]
id = "ko-emoji-marker"
lang = "any"
severity = "error"
pattern = '(?m)^[ \t]*([-*+]|#{1,6}|\d+\.)\s*[\U0001F300-\U0001FAFF☀-➿⭐]'
message = "목록·제목 앞 이모지"
suggest = "이모지 삭제 (상태 표시가 꼭 필요하면 표의 열로)"

[[rule]]
id = "ko-register-mix"
kind = "register"
lang = "ko"
severity = "error"
pattern = '(니다|니까)[.?!]|[^니]요[.?!]'
message = "한 문서 안에서 종결 어미(합니다체·해요체·한다체)가 섞였습니다"
suggest = "문서 하나에 문체 하나 (문서 기본: 합니다체)"

[[rule]]
id = "ko-haeyo"
lang = "ko"
severity = "error"
pattern = '[가-힣](?<!니)(어요|아요|예요|에요|해요|돼요|죠|세요\?)[.?!]'
message = "해요체 문장 (문서 기본은 합니다체)"
suggest = "합니다체로: ~해요 → ~합니다, ~돼요 → ~됩니다 (해요체 제품 UI는 .style/rules.toml에서 이 규칙 해제)"
max_per_file = 2

[[rule]]
id = "ko-colloquial"
lang = "ko"
severity = "error"
pattern = '거예요|거에요|잖아요|잖습니까|해\s?줘요|해\s?드려요|\s딱\s|\s그냥\s|\s되게\s|엄청'
message = "구어체 표현"
suggest = "문서체로 교체 또는 삭제"

[[rule]]
id = "ko-personify"
lang = "ko"
severity = "error"
pattern = '(일|작업|업무)[이가]\s?(\S+\s)?흘러[가갑간갈]|알아서\s?(챙|처리|해)|일이\s?(돌아|굴러)|척척|술술|뚝딱'  # "데이터가 흘러가는" (data flow) is a technical term
message = "일·도구를 사람처럼 쓰는 구어 표현"
suggest = "주체와 동작 명시 (예: 워크플로가 라벨을 변경합니다)"

[[rule]]
id = "ko-reader-talk"
lang = "ko"
severity = "error"
pattern = '걱정하지\s?마세요|어렵지\s?않(아요|습니다)|한번\s?볼까요|살펴볼까요|함께\s?(알아|살펴)보|궁금하시죠'
message = "독자에게 말을 거는 문장"
suggest = "삭제, 바로 내용으로 시작"

# Added from an adversarial review of the ai-design page (structure-level tells in Korean prose).
[[rule]]
id = "ko-metaphor-verb"
lang = "ko"
severity = "warning"
pattern = '(걸러|덜어|녹여|담아|짚어)\s?(내|냅|낸|냈|낼)|덜어\s?(줍|주는|드립|드리)|(담았|녹였)습니다|녹아\s?있'
message = "동작을 비유 동사로 표현 ('걸러 냅니다', '덜어 줍니다', '담았습니다')"
suggest = "실제 동작 동사로 교체 (걸러 냅니다 → 검사하고 위치를 알립니다)"
max_per_file = 1

# Measured on research/ai-vs-human (docs/measurement.md, 1.6.0): every branch is narrowed until it reports no human doc.
# "길" needs a -는 adnominal and a metaphor continuation, so 길이 (length), 길찾기, 지름길 and the literal "가는 길에"
# stay quiet; bare 여정, 열쇠, 첫걸음 and 청사진 are used by human translators ("React 여정을 시작", "JavaScript 첫걸음").
[[rule]]
id = "ko-metaphor-noun"
lang = "ko"
severity = "warning"
pattern = '[가-힣]는\s?길(이\s?(있|없)|은\s|을\s?(따라|안내|보여|알려|제시|제공|찾아|살펴|정리|소개)|입니다|이다|이에요|도\s?(있|없)|만\s?(있|없)|(?=[ \t.:]*(\n|$)))|(의|가는|향하는|이르는|따라가는)\s?여정|여정을\s?(따라|떠나)|전체\s?지도|한\s?장의\s?지도|지도처럼|(?<![가-힣])문(을\s?(열어\s?(줍|주는|주고|줄|드립|둡)|엽니다|여는)|이\s?열립)|(가능성|기회)의\s?문(을|이|은|도|\s)|핵심\s?열쇠|열쇠를\s?쥐|(성공|해결|이해)의\s?열쇠|첫\s?걸음을\s?(내딛|뗍|떼|딛)|발판(을\s?마련|으로\s?삼|이\s?됩|이\s?되어\s?줍)|디딤돌|나침반|청사진(을\s?(제시|그리|그려|보여|펼)|입니다|이\s?됩)'
message = "과정·연결을 비유 명사로 표현 ('가는 길', '여정', '전체 지도')"
suggest = "실제 대상과 동작으로 (샘플 페이지로 가는 길이 있습니다 → 샘플 페이지 링크가 있습니다)"

[[rule]]
id = "ko-universal-claim"
lang = "ko"
severity = "warning"
pattern = '어느\s?(프로젝트|팀|환경|회사|조직|서비스|제품|언어|도구|코드베이스|레포)(에나|에서나|이든|든지)|어디(에나|서나|든)\s?(붙|쓸|적용|도입)|어떤\s?(프로젝트|팀|환경|조직|서비스|제품|코드베이스|레포)(에도|에서도)\s?(붙|쓸|동작|적용|사용)'  # scope inside a system ("트리의 어느 위치에서나") is a fact
message = "근거 없는 범용 주장 ('어느 프로젝트에나')"
suggest = "실제 전제 조건으로 교체 (Python 3.11 이상, .md·.html·.tsx 파일)"

[[rule]]
id = "ko-reason-cleft"
lang = "ko"
severity = "warning"
pattern = '(이유|까닭)는\s[^.?!\n]{1,100}?때문(입니다|이다|이에요)[.]'
max_per_file = 2  # once or twice reads naturally in human docs; the tell is the repeated frame
message = "'~하는 이유는 ~때문입니다' 설명 구문"
suggest = "원인을 주어로 바로 서술 (기본값을 매번 새로 정해서 화면이 비슷해집니다), 근거 없는 인과는 삭제"

[[rule]]
id = "ko-paired-contrast"
lang = "ko"
severity = "warning"
pattern = '(?<![가-힣])[가-힣A-Za-z]+(은|는)\s[^,.\n]{1,30}?(으로|로|에만|만),\s[^,.\n]{0,15}?[가-힣A-Za-z]+(은|는|이면|으면)\s[^,.\n]{1,30}?(으로|로|에만|만)\s'
message = "'X는 A로, Y는 B로' 대칭 대구 반복"
suggest = "문장 하나에 사실 하나, 또는 표로 이동"
max_per_file = 1

[[rule]]
id = "ko-just-one"
lang = "ko"
severity = "warning"
pattern = '(?<=[가-힣A-Za-z0-9)])(?<!중)\s(하나|한\s가지)(로|가|를|만|뿐|입니다|\s|[.,)])'
message = "'X 하나' 단일성 강조 반복"
suggest = "수가 중요할 때만 유지 (합니다체 하나로 씁니다 → 합니다체로 씁니다)"
max_per_file = 4

# Essay and news-commentary tells from epoko77-ai/im-not-ai (MIT; ai-tell-taxonomy.md, metrics_v2.py). On the
# technical-docs comparison corpus (docs/measurement.md) none of these fired on 664 human docs; they target
# columns, reports and announcements, the kind of text the essay probe in docs/measurement.md covers.

[[rule]]
id = "ko-meeting-gajida"
lang = "ko"
severity = "warning"
pattern = '(?:회의|미팅|면담|인터뷰|토론)[을를]\s?(?:가졌|가지|가질|갖)'
message = "'회의를 가지다' (have a meeting 직역)"
suggest = "회의를 했다 / 열었다 / 만났다"

[[rule]]
id = "ko-ilueojida"
lang = "ko"
severity = "warning"
pattern = '(?:논의|합의|협의|검토|결정|조정|협력|투자|거래)가\s?이루어(?:졌|진|지|집)'
message = "'~가 이루어지다' 피동 우회"
suggest = "능동 동사로 (합의했다 / 논의한다)"
max_per_file = 2

[[rule]]
id = "ko-abstract-subject-verb"
lang = "ko"
severity = "warning"
pattern = '(?:등장|출현|확산|부상|트렌드|혁신|흐름|변화)(?:은|는)\s[^.!?\n]{0,35}(?:보여줍니다|보여준다|보여줬다|시사합니다|시사한다|가져옵니다|가져온다|가져오고|일으킵니다|일으킨다|일으키며|말해줍니다|말해준다)'
message = "추상 주어 + 만능 동사 (보여준다·가져온다)"
suggest = "행위자를 주어로 (이 흐름으로 새 기회가 열린다)"

[[rule]]
id = "ko-evaluative-clear"
lang = "ko"
severity = "warning"
pattern = '(?:점|사실|가치|의미|방향|효과|차이|필요성|결과)(?:은|는)\s?(?:명확|분명)(?:하다|합니다|하며|하고|해\s?보입니다|해\s?보인다|해졌다)'
message = "'~는 명확하다·분명하다' 평가 술어"
suggest = "명제를 바로 단언 (AI를 도입해야 한다)"

[[rule]]
id = "ko-foundation-formula"
lang = "ko"
severity = "warning"
pattern = '(?:발판|토대|초석|주춧돌|교두보)[을를]\s?(?:마련|놓|다지)|활로[를을]\s?(?:열|연다|열었|열어)'
message = "'발판·토대를 마련하다' 기반 마련 공식"
suggest = "그 조치가 실제로 가능하게 하는 일을 서술"

[[rule]]
id = "ko-english-buzzword-hada"
lang = "ko"
severity = "warning"
pattern = '\b(?:seamless|robust|holistic|scalable|leverag(?:e|ing)|cutting-edge)(?:하|한|해|하여|하는)'
message = "영어 buzzword + 한국어 어미 (seamless하다·leverage하다)"
suggest = "한국어로 풀기 (끊김 없는, 안정적인, 활용하여)"

[[rule]]
id = "ko-first-second-third"
lang = "ko"
severity = "warning"
pattern = '첫째[,，]\s[^\n]{5,200}?둘째[,，]\s[^\n]{5,200}?셋째[,，]'
message = "'첫째·둘째·셋째' 기계적 병렬 열거"
suggest = "목록이나 산문으로 풀기 (우선·이어서·마지막으로 변주)"

[[rule]]
id = "ko-inline-numbering"
lang = "ko"
severity = "warning"
pattern = '(?<!\d)1\)\s[^\n]{5,}?(?<!\d)2\)\s[^\n]{5,}?(?<!\d)3\)\s'
message = "문장 속 '1) 2) 3)' 인라인 번호 매기기"
suggest = "본문에 녹이거나 우선·다음으로"

[[rule]]
id = "ko-colon-subtitle-heading"
lang = "ko"
severity = "warning"
pattern = '(?m)^#{1,6}\s+\**(?:서론|본론|결론|도입|개요|배경|핵심|요약|마무리)(?:\s?\d+)?\**[:：]\s*\S'
message = "구조 라벨 + 콜론 부제 헤딩"
suggest = "헤딩을 단일 명사구로"

[[rule]]
id = "ko-opens-possibility"
lang = "ko"
severity = "warning"
pattern = '가능성을\s?열어\s?(?:준다|줍니다|주는|주었다|줬다)'
message = "'가능성을 열어준다' hype 동사구"
suggest = "무엇이 가능해지는지 서술"

[[rule]]
id = "ko-more-than-ever"
lang = "ko"
severity = "warning"
pattern = '그\s?어느\s?때보다'
message = "'그 어느 때보다' 최상급 상투구"
suggest = "비교 대상을 숫자로"

[[rule]]
id = "ko-personified-subject"
lang = "ko"
severity = "warning"
pattern = '(?:충돌|가성비|기술|시대|현실|역사|데이터|변화|질문|숫자|통계|혁신|위기|경쟁|등장|흐름|물결|AI|인공지능|수치|결과|시장|지표)(?:이|가)\s(?:[가-힣]{1,8}[을를]\s)?(?:던집니다|던진다|묻습니다|묻는다|부릅니다|부른다|증명합니다|증명한다|말해줍니다|말해준다|속삭입니다|속삭인다|외칩니다|외친다|원한다|원합니다|답을\s?내놓)'
message = "추상 주어의 의인화 ('기술이 묻는다', '시장이 원한다')"
suggest = "사람·기관을 주어로, 또는 동사를 평이하게"

[[rule]]
id = "ko-leads-to-chain"
lang = "ko"
severity = "warning"
pattern = '이는\s결국|결국[^.!?\n]{0,50}(?:으?로)\s?이어(?:진다|집니다)|에\s?직결(?:된다|됩니다|되는)'
message = "'결국 ~로 이어진다 / ~에 직결된다' 인과 결산"
suggest = "인과의 실제 경로를 쓰거나 단문으로 끊기"

[[rule]]
id = "ko-this-is-why"
lang = "ko"
severity = "warning"
pattern = '[가-힣]\s?이유(?:다|이다)[.!]'
message = "문장 끝 '~하는 이유다' 도치 결산"
suggest = "순방향 단언 ('그래서 ~다')"

[[rule]]
id = "ko-empty-caveat"
lang = "ko"
severity = "warning"
pattern = '(?:^|[.!?]\s+|\n)(?:(?:그러나|다만|하지만|물론)[,\s]+)?(?:과제|한계|숙제|아쉬운\s?점|우려|위험)(?:도|는)\s?(?:여전히\s)?(?:남아\s?있다|남아\s?있습니다|분명하다|분명합니다|있다|있습니다)[.]'
message = "내용 없는 반론 문패 ('과제도 남아 있다')"
suggest = "문패를 지우고 실제 과제를 첫 문장에"

[[rule]]
id = "ko-sensory-evaluation"
lang = "ko"
severity = "warning"
pattern = '(?:진단|경고|분석|통계|현실|숫자|지적|전망)(?:은|는)\s?(?:서늘|아프|차갑|뜨겁|묵직|섬뜩)(?:하다|다|합니다|습니다)'
message = "감각 술어 평가문 ('진단은 서늘하다')"
suggest = "관용구나 구체 서술로"

[[rule]]
id = "ko-synonym-pair"
lang = "ko"
severity = "warning"
pattern = '[가-힣]{2,6}고\s(?:[가-힣]{2,5}적인|꾸준한)\s(?:역할|접근|노력|방법|전략|기능|영향|변화)'
message = "동의어 이중 수식 ('중요하고 핵심적인')"
suggest = "수식어 하나만"

[[rule]]
id = "ko-role-and-function"
lang = "ko"
severity = "warning"
pattern = '(?:역할과\s기능|기능과\s역할|의미와\s가치|가치와\s의미)'
message = "동의어 병렬 명사 ('역할과 기능')"
suggest = "하나만"

[[rule]]
id = "ko-hedge-double"
lang = "ko"
severity = "warning"
pattern = '(?:가능성|여지|우려)(?:이|가)\s?있을\s?수\s?(?:도\s?)?있'
message = "이중 완곡 ('가능성이 있을 수 있다')"
suggest = "완곡 하나만"

[[rule]]
id = "ko-unattributed-verdict"
lang = "ko"
severity = "warning"
pattern = '[다라]는\s?(?:분석|평가|관측|전망|지적|해석)(?:이다|입니다)[.]'
message = "무주체 판정 종결 ('~다는 분석이다')"
suggest = "출처가 있으면 출처를 앞에, 없으면 직접 서술"

# 1.6.0: Korean tells from IsaacEryn/humanizer-ko, amondnet/yoonmoon, leeandev/stop-slop-ko,
# dongsukjang26/natural-korean-skills-for-research, nerdkim/im-a-korean-ai-in-seoul and teo713ko-gif/hangul-humanizer
# (all MIT). Kept only if they fired on at most 1 of 525 human train docs (research/oss-patterns/README.md).
# Patterns are ours.

[[rule]]
id = "ko-legacy-inflation"
lang = "ko"
severity = "warning"
pattern = '한\s?획을\s?(?:긋|그었|그은|그을)|전환점을\s?마련|(?:업계|시장|산업|생태계)의?\s?지형을\s?(?:바꾸|바꿨|바꾼|바꿀|바꿔)|큰\s?흐름을\s?반영|깊이\s?뿌리\s?내린|(?:주요|국내외|여러|각종)\s?(?:언론|매체)(?:에|의|들의?)\s?(?:소개|보도|주목|인용|조명)|언론의\s?(?:큰\s)?주목을\s?받|아무리\s?강조해도\s?지나치지\s?않'
message = "의의·유산 부풀리기 ('한 획을 긋다', '전환점을 마련하다', '언론의 주목')"
suggest = "무슨 일이 언제 있었는지만 서술 (1987년에 개관했다)"

[[rule]]
id = "ko-promo-vocab"
lang = "ko"
severity = "warning"
pattern = '(?:을|를)\s?자랑(?:한다|합니다|하는|하며|해\s?왔)|명실상부(?:한|하게)|자락에\s?(?:자리한|자리\s?잡은|위치한)|꼭\s?가\s?봐야\s?할|빼어난\s|손꼽히는\s'
message = "홍보성 수식 ('~를 자랑하는', '명실상부한', '빼어난')"
suggest = "무엇이 있는지 사실로 (전시실은 네 개다)"

[[rule]]
id = "ko-vague-attribution"
lang = "ko"
severity = "warning"
pattern = '(?<![가-힣])(?:전문가들(?:은|에\s?따르면|의\s?(?:의견|견해))|일각에서는|업계에서는\s|관계자들에\s?따르면|(?:여러|많은|다수의)\s?연구(?:에\s?따르면|들?(?:이|은)\s?(?:보여|밝혀|입증)))'
message = "출처 없는 권위 ('전문가들은', '일각에서는', '여러 연구에 따르면')"
suggest = "출처를 밝히거나 귀속을 지우고 명제만"

[[rule]]
id = "ko-closing-cliche"
lang = "ko"
severity = "warning"
pattern = '(?:과제|도전|어려움|난관)에\s?직면(?:해\s?있|하고\s?있|했|한다|합니다|하게)|행보가\s?(?:더욱\s)?기대|앞으로가\s?(?:더욱\s?|더\s)?기대(?:된다|됩니다)|미래는\s?밝(?:다|습니다)|우리\s?모두의\s?(?:과제|숙제|몫|책임)|[가-힣]는\s?사람이\s?되겠(?:다|습니다)'
message = "과제·전망 상투구 ('과제에 직면해 있다', '앞으로의 행보가 기대된다', '우리 모두의 과제다')"
suggest = "마지막 사실이나 실제 계획으로 끝내기"

[[rule]]
id = "ko-ai-buzzword"
lang = "ko"
severity = "warning"
pattern = '시너지(?:를|가|\s?효과)|급부상(?:하|했|한|해|중)|(?:을|를)\s?조명(?:한다|합니다|하는|했|하고)'
message = "AI가 몰아 쓰는 어휘 (시너지, 급부상, 조명하다)"
suggest = "구체적인 동작으로 (함께 쓰면 빌드가 20% 빨라진다)"

[[rule]]
id = "ko-copula-avoidance"
lang = "ko"
severity = "warning"
pattern = '(?:으로|로)\s?자리\s?잡고\s?있|역할을\s?수행(?:하고\s?있|한다|합니다|해\s?왔)|(?:으로|로)\s?기능하고\s?있|(?:으로|로)\s?평가받고\s?있'
message = "'~이다' 회피 서술어 ('~로 자리잡고 있다', '역할을 수행하고 있다')"
suggest = "~이다 / ~이 있다 (협회의 전시 공간이다)"

[[rule]]
id = "ko-interpretive-rider"
lang = "ko"
severity = "warning"
pattern = '(?:상징|반영|대변|방증)하며,?\s|(?:보여\s?주|드러내)며,?\s[^.!?\n]{0,40}(?:마음|의지|정신|가치|노력|태도)|함으로써\s[^.!?\n]{0,40}?(?:기여|이바지)(?:한다|합니다|했다|했습니다|하고)'
message = "해석을 덧붙이는 부가절 ('~를 상징하며', '~함으로써 기여한다')"
suggest = "사실만 남기고 해석은 출처가 있을 때만"

[[rule]]
id = "ko-chatbot-offer"
lang = "ko"
severity = "warning"
pattern = '(?:해|알려|들어|정리해|설명해|만들어|작성해)\s?드릴까요\?|(?:더\s)?자세한\s?(?:설명|내용|정보)이\s?필요하시면|계속할까요\?|원하시면\s[^.!?\n]{0,20}?(?:알려|정리해|설명해|만들어)\s?드리|(?:좋은\s?지적|(?:훌륭한|정확한|예리한|날카로운)\s?(?:지적|질문))(?:입니다|이네요|이십니다|이시네요|이에요|이세요)|탁월한\s?(?:관점|질문|지적|통찰)'
message = "챗봇의 제안·칭찬 ('~해 드릴까요?', '정확한 지적입니다')"
suggest = "삭제"

[[rule]]
id = "ko-knowledge-gap"
lang = "ko"
severity = "warning"
pattern = '구체적인\s?(?:정보|자료)(?:는|가)\s?(?:공개되어\s?있지\s?않|공개되지\s?않|알려져\s?있지\s?않)|확인\s?가능한\s?(?:자료|정보)에\s?따르면|알려진\s?바가\s?(?:많지\s?않|거의\s?없)|제\s?(?:지식|학습\s?데이터)(?:은|는|의)?\s?(?:기준|한계)'
message = "지식 한계 면책 ('구체적인 정보는 공개되어 있지 않으나')"
suggest = "모르는 것은 문장을 지우거나 출처를 찾아 쓰기"

[[rule]]
id = "ko-staged-opening"
lang = "ko"
severity = "warning"
pattern = '(?:하나씩|차근차근|하나하나)\s?짚어\s?(?:보겠|드리겠|드릴게|봅시다|보자)|본격적으로\s?(?:들어가기|시작하기)\s?(?:전에|에\s?앞서)|시작해\s?볼까요|본\s?(?:보고서|리포트|레포트)에서는|이상으로\s[^.\n]{0,25}살펴보았|사전적\s?(?:의미|정의)(?:로|는|에\s?따르면)|(?:이)?라는\s?말이\s?있(?:다|습니다|듯)'
message = "예고·명언으로 여는 도입 ('하나씩 짚어 보겠습니다', '본 보고서에서는', '사전적 의미로')"
suggest = "첫 문장을 주장이나 핵심 사실로"

[[rule]]
id = "ko-performed-candor"
lang = "ko"
severity = "warning"
pattern = '솔직히\s?(?:말해서|말하면|말씀드리면)|솔직히\?|까놓고\s?(?:말하면|말해서)|사실\s?말이죠'
message = "가짜 솔직 훅 ('솔직히 말해서')"
suggest = "삭제하고 주장만"

[[rule]]
id = "ko-aphorism"
lang = "ko"
severity = "warning"
pattern = '[가-힣A-Za-z]+(?:은|는)\s[가-힣A-Za-z]+의\s(?:언어|통화|문법|건축학|화폐)(?:다|이다|입니다)[.]|(?:도구|수단)가\s?아니라\s(?:거울|태도|철학|언어|문화)(?:다|이다|입니다)'
message = "경구 공식 ('X는 Y의 언어다')"
suggest = "공식이 가리키던 구체적 주장으로"

[[rule]]
id = "ko-staccato-negation"
lang = "ko"
severity = "warning"
pattern = '도\s?없(?:었)?(?:다|습니다)\.\s+[^.!?\n]{1,25}?도\s?없(?:었)?(?:다|습니다)\.'
message = "부정 단문 연타 ('X도 없었다. Y도 없었다.')"
suggest = "한 문장으로 합치기"

[[rule]]
id = "ko-calque"
lang = "ko"
severity = "warning"
pattern = '고\s?있는\s?중(?:이다|입니다|이에요|이며|이고)|지\s?않으면\s?안\s?(?:된다|됩니다|돼요|돼)|결정을\s?만(?:든|들|듭)|대비\s[^.\n]{0,30}상이|의\s?(?:증가|감소|향상|하락|상승|저하)(?:를|을)\s?(?:보였|보인|보이|초래)|(?:이러한|이와\s?같은|이런)\s?맥락에서'
message = "영어·일본어 구문 직역 ('~하고 있는 중이다', '~하지 않으면 안 된다', '이러한 맥락에서')"
suggest = "한국어 동사로 (검토 중이다 / 해야 한다 / 늘었다)"

[[rule]]
id = "ko-pleonasm"
lang = "ko"
severity = "warning"
pattern = '미리\s?(?:예측|예상|예고)|함께\s?협력|다시\s?재(?:시작|검토|확인|발견|정의)|먼저\s?선행|매(?:일|주|달|월|년)마다|과반수\s?이상'
message = "같은 뜻을 겹친 표현 ('미리 예측', '함께 협력', '매주마다')"
suggest = "한쪽만 남기기 (예측한다 / 협력한다 / 매주)"

[[rule]]
id = "ko-brings-about"
lang = "ko"
severity = "warning"
pattern = '(?:향상|개선|변화|효과|혁신|성장|이점|이익|발전|감소|증가|혼란)[을를]\s?가져(?:온다|옵니다|왔다|왔습니다|올\s|오는|오며|다준)'
message = "추상 결과 + '가져오다' ('효율의 향상을 가져온다')"
suggest = "원인과 결과를 동사로 (이렇게 바꾸면 빨라진다)"

[[rule]]
id = "ko-balance-pair"
lang = "ko"
severity = "warning"
pattern = '장단점이\s?(?:모두|공존)|장점과\s?단점이\s?(?:모두|공존|함께)|한편으로는[^.!?\n]{1,60}다른\s?한편으로는|(?:단순한|평범한|작은)\s?[가-힣]+에서\s[^.!?\n]{1,20}?(?:으로|로)\s?(?:진화|거듭|변모|탈바꿈|도약)'
message = "균형 강박·변신 도식 ('장점과 단점이 모두 존재한다', '단순한 도구에서 필수 파트너로')"
suggest = "핵심 비교 한 가지를 구체적으로"

[[rule]]
id = "ko-think-repeat"
lang = "ko"
severity = "warning"
pattern = '[다라]고\s?(?:생각(?:한다|합니다|된다|됩니다|해요)|본다|봅니다)|[다라]는\s?생각이\s?(?:든다|듭니다)'
message = "'~라고 생각한다' 반복"
suggest = "근거가 있으면 단정, 정말 의견인 곳 하나만"
max_per_file = 2

[[rule]]
id = "ko-spaced-middot-list"
lang = "ko"
severity = "warning"
# Only a list inside a sentence: the line must reach a predicate ending without crossing a run of 2+ spaces (where
# markup was). Metadata rows ("장면 02 · 창조 · 35초") and one middot per <li> are UI separators, not prose.
pattern = '(?m)(?<=[가-힣A-Za-z0-9])[  ]·[  ](?=[가-힣A-Za-z0-9])(?:(?![ \t]{2})[^\n])*?(?<=[가-힣A-Za-z0-9])[  ]·[  ](?=[가-힣A-Za-z0-9])(?=(?:(?![ \t]{2})[^\n])*?(?:니다|[다요])(?:[.!?]|[ \t]*$))'
message = "공백 가운뎃점 나열 ('속도 · 품질 · 비용')"
suggest = "쉼표로 나열하거나 붙여 쓴 가운뎃점(속도·품질)"

[[rule]]
id = "ko-bold-label-list"
lang = "ko"
severity = "warning"
pattern = '(?m)^[ \t]*(?:[-*+]|\d+\.)\s+\*\*[^*\n]{1,20}?[:：]\*\*|^[ \t]*(?:[-*+]|\d+\.)\s+\*\*[^*\n]{1,20}?\*\*[:：]'
message = "굵은 머리말 + 쌍점 목록이 잦음"
suggest = "머리말을 빼고 문장으로, 굵게는 UI 이름과 핵심 값에만"
max_per_file = 3
max_per_1k = 15  # 1.6.0: AI-written Korean docs 22% (train), human 0.2%

# ───────────────────────── English prose ─────────────────────────

[[rule]]
