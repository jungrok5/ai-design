# ai-design style rules: the AI tone in prose and the AI look in UI code.
# Standard and reasoning: docs/standard.md (github.com/jungrok5/ai-design). Engine: style_check.py (stdlib only).
#
# severity: error   = almost always wrong in product copy and docs; CI fails on it
#           warning = often wrong; the hook shows it to the agent, CI only reports it
#           off     = disabled (use in a repo's .style/rules.toml to turn a rule off)
# kind:     prose   = text a person reads (Markdown outside code, HTML text)
#           markup  = raw HTML/CSS/JSX/TSX/Vue/Svelte source
#           register= Korean speech level mixing (합니다체 vs 해요체) in one file
# max_per_file: report only when the pattern occurs more often than this in one file.
#
# Pattern ideas are adapted from MIT/Apache-2.0 sources (blader/humanizer, epoko77-ai/im-not-ai,
# DaleSeo/korean-skills, vercel-labs/writing-guidelines and web-interface-guidelines, anthropics/skills
# frontend-design, pbakaus/impeccable) and paraphrased from Wikipedia "Signs of AI writing" (CC BY-SA)
# and the Toss technical-writing guide (CC BY-NC-SA). See ../THIRD_PARTY_NOTICES.md. Wording is ours.

# ───────────────────────── Korean prose ─────────────────────────

[[rule]]
id = "ko-hype"
lang = "ko"
severity = "error"
pattern = '(혁신|획기|압도|파격|폭발|대대|가히\s?혁명)적|전례\s?없는|막강한|게임\s?체인저|차세대\s?(솔루션|플랫폼|기술)'
message = "근거 없는 과장 수식어"
suggest = "무엇이 얼마나 나아지는지 숫자나 동작으로 서술 (예: 응답 1 ms 이하)"

[[rule]]
id = "ko-ai-boilerplate"
lang = "ko"
severity = "error"
pattern = '강력한\s*(AI|인공지능|기능|성능)|AI\s?기반의?\s*(강력|혁신|스마트|지능형)|스마트한\s?(솔루션|경험)|새로운\s?패러다임'
message = "AI가 자주 쓰는 상투 문구"
suggest = "제품이 실제로 하는 일로 교체"

[[rule]]
id = "ko-closing-formula"
lang = "ko"
severity = "error"
pattern = '결론적으로|요약하자면|정리하자면|종합하자면|종합적으로\s?볼\s?때'
message = "결말 공식"
suggest = "요약 접속어 삭제, 마지막 사실로 마무리"

[[rule]]
id = "ko-inflation"
lang = "ko"
severity = "error"
pattern = '시사하는\s?바가\s?(크|큽|커)|주목할\s?만하|간과할\s?수\s?없|지평을\s?(열|넓)|새로운\s?장을\s?열|시대가\s?도래|패러다임\s?전환|중요한\s?이정표'
message = "의미 부풀리기"
suggest = "삭제 또는 구체적인 결과(날짜, 수치)로 교체"

[[rule]]
id = "ko-question-heading"
lang = "ko"
severity = "warning"
pattern = '(?m)^#{1,6}\s(?!\[)[^\n]*[가-힣][^\n]*(\?|인가|일까|할까)\s*$'
message = "질문형 제목 (FAQ가 아닌 절)"
suggest = "그 절이 말하는 사실을 제목으로 (예: '얼마나 빨라졌나요?' → '배포 시간')"

[[rule]]
id = "ko-slogan"
lang = "ko"
severity = "warning"
pattern = '(?:이)?면\s?(?:끝|충분|그만|OK)(?:입니다|이에요|이다)?[.!]?(?=\s|$)'
message = "슬로건형 끝맺음 ('~면 끝')"
suggest = "주어와 동사가 있는 문장 (예: '명령 하나로 배포합니다')"

[[rule]]
id = "ko-cta-now"
lang = "ko"
severity = "warning"
pattern = '지금\s?(?:바로\s?)?[가-힣]+\s?(?:보세요|하세요)'
message = "재촉하는 행동 유도 문구"
suggest = "버튼과 링크는 누르면 일어나는 일 (예: 'shipit 설치')"

[[rule]]
id = "ko-now-is-the-time"
lang = "ko"
severity = "error"
pattern = '지금이야말로|할\s?때입니다|할\s?때예요|할\s?시점입니다'
message = "선동형 결말"
suggest = "지금 하면 달라지는 점을 서술"

[[rule]]
id = "ko-double-passive"
lang = "ko"
severity = "error"
pattern = '되어(지|집|진|져)|지게\s?(됩니다|돼요|된다)'
message = "이중 피동, 또는 '~지게 됩니다' 우회"
suggest = "됩니다 / 누가 하는지 주어 명시"

[[rule]]
id = "ko-ni-isseoseo"
lang = "ko"
severity = "error"
pattern = '(?<![안속위밑곳뒤앞옆치래부])에\s?있어서?\s'  # "파일 안에 / 위치에 / 인터페이스 뒤에 있어"(=because it is in) is fine
message = "번역투 '~에 있어(서)'"
suggest = "~에서, ~할 때"

[[rule]]
id = "ko-chatbot-residue"
lang = "ko"
severity = "error"
pattern = '도움이\s?되(셨|었)(길|으면)|궁금한\s?점이\s?있으시면\s?언제든|좋은\s?질문|물론입니다!'
message = "챗봇 말투가 남음"
suggest = "삭제"

# The next four were found by comparing Claude-written Korean docs with human docs on the same 178 topics
# (docs/measurement.md, "AI 글과 사람 글 비교"). Held-out test: 26% of AI docs vs 1.4% of human docs hit any of them.

[[rule]]
id = "ko-advise"
lang = "ko"
severity = "warning"
pattern = '(기를|길|시길|는\s?것을|는\s?걸)\s?권(합니다|해요|해\s?드립니다)'  # not 권장/추천: normal in technical docs
message = "조언하는 말투 ('~하시길 권합니다')"
suggest = "할 일과 이유를 바로 서술 (예: 베타에서 먼저 빌드합니다. 정식판에서 API가 바뀝니다)"

[[rule]]
id = "ko-template-heading"
lang = "ko"
severity = "warning"
pattern = '(?m)^#{1,6}\s[^\n]*(체크리스트|체크\s?포인트|핵심\s?포인트|핵심\s?정리|한눈에\s?(보기|정리))\s*$'
message = "틀에 박힌 절 제목 (체크리스트, 핵심 포인트, 핵심 정리)"
suggest = "그 절이 실제로 담은 내용을 제목으로 (예: '체크리스트' → '배포 전 확인할 설정')"

[[rule]]
id = "ko-count-runup"
lang = "ko"
severity = "warning"
pattern = '[은는]\s(다음\s)?(두|세|네|다섯|여섯)\s?가지(입니다|예요|이다)'
message = "개수를 먼저 예고하는 도입 ('변경은 세 가지입니다')"
suggest = "예고 없이 목록이나 첫 항목으로 시작"

[[rule]]
id = "ko-hedged-advice"
lang = "ko"
severity = "warning"
pattern = '(편이|것이)\s?(안전|낫|바람직)(합니다|습니다|해요|다)|두는\s?(것이|편이)\s?좋(습니다|아요)'
message = "에둘러 권하는 말투 ('~하는 편이 안전합니다')"
suggest = "조건과 결과를 서술 (예: CI에서 먼저 돌리지 않으면 strict 오류가 배포 후에 드러납니다)"

[[rule]]
id = "ko-must-important"
lang = "ko"
severity = "warning"
pattern = '것이\s?(중요|필수|핵심)(합니다|해요|하다|적)'
message = "'~하는 것이 중요합니다'"
suggest = "해야 할 일을 바로 서술 (예: 매일 백업합니다)"

[[rule]]
id = "ko-tonghae"
lang = "ko"
severity = "warning"
pattern = '(을|를)\s?통(해|하여|한)\s'
message = "번역투 '~을 통해'"
suggest = "~로, ~에서"
max_per_file = 2

[[rule]]
id = "ko-daehae"
lang = "ko"
severity = "warning"
pattern = '에\s?대(해서?|하여)\s'
message = "번역투 '~에 대해'"
suggest = "목적어로 바로 연결 (미래에 대해 분석 → 미래를 분석)"
max_per_file = 3

[[rule]]
id = "ko-gajigo-itda"
lang = "ko"
severity = "warning"
pattern = '을\s?가지고\s?있|를\s?가지고\s?있'
message = "번역투 '~을 가지고 있다'"
suggest = "성능이 높습니다 / ~이 있습니다"

[[rule]]
id = "ko-uihae"
lang = "ko"
severity = "warning"
pattern = '에\s?의(해|하여|한)\s'
message = "피동 '~에 의해'"
suggest = "주어를 앞으로 (팀이 개발했습니다)"

[[rule]]
id = "ko-related-based"
lang = "ko"
severity = "warning"
pattern = '와\s?관련(하여|된)|과\s?관련(하여|된)|에\s?기반(하여|한)|라는\s?점에서'
message = "번역투 연결어"
suggest = "~의, ~로, ~에서"
max_per_file = 2

[[rule]]
id = "ko-cleft"
lang = "ko"
severity = "warning"
pattern = '(중요한|필요한)\s?것은|핵심은\s|관건은\s'
message = "'중요한 것은 X이다' 구문"
suggest = "X를 주어로 바로 서술"

[[rule]]
id = "ko-vague-praise"
lang = "ko"
severity = "warning"
pattern = '다양한|효과적(인|으로)|원활(한|하게)|최적의|효율적(인|으로)|손쉽게|간편하게|완벽(한|하게)|스마트한'
message = "모호한 칭찬 어휘"
suggest = "개수와 속도를 숫자로 서술"
max_per_file = 2

[[rule]]
id = "ko-noun-verb"
lang = "ko"
severity = "warning"
pattern = '(작업|처리|검토|확인|배포|설치)(을|를)\s?(수행|진행|실시)'
message = "명사 + 수행/진행/실시"
suggest = "동사로 (삭제 작업을 수행합니다 → 삭제합니다)"

[[rule]]
id = "ko-metadiscourse"
lang = "ko"
severity = "warning"
pattern = '알아보(겠|도록)|살펴보(겠|도록)|아시다시피|앞서\s?(설명|말)(했|한)|이번\s?(글|문서)에서는'
message = "글에 대한 글"
suggest = "지우고 바로 내용으로"

[[rule]]
id = "ko-hedge-stack"
lang = "ko"
severity = "warning"
pattern = '것으로\s?(보입니다|보여요|예상됩니다|판단됩니다)|수\s?있을\s?것으로'
message = "겹친 추측 표현"
suggest = "확인한 사실은 단정, 모르는 것은 모른다고 명시"

[[rule]]
id = "ko-not-but"
lang = "ko"
severity = "warning"
pattern = '단순(히|한)\s?\S+(을|를)?\s?넘어|뿐만\s?아니라'
message = "'단순한 X를 넘어 / ~뿐만 아니라' 대구"
suggest = "할 수 있는 일만 나열"
max_per_file = 1

[[rule]]
id = "ko-connective-comma"
lang = "ko"
severity = "warning"
pattern = '(하|되|있|없|이|았|었|였|르|많|크|작|빠르|쉽)(고|며|면서|지만|는데|어서|아서),\s'
message = "연결어미 뒤 쉼표"
suggest = "쉼표 삭제 또는 문장 분리"
max_per_file = 3

[[rule]]
id = "ko-emoji-marker"
lang = "any"
severity = "error"
pattern = '(?m)^[ \t]*([-*+]|#{1,6}|\d+\.)\s*[\U0001F300-\U0001FAFF☀-➿⭐]'
message = "목록·제목 앞 이모지"
suggest = "이모지 삭제 (상태 표시가 꼭 필요하면 표의 열로)"

[[rule]]
id = "ko-register-mix"
kind = "register"
lang = "ko"
severity = "error"
pattern = '(니다|니까)[.?!]|[^니]요[.?!]'
message = "한 문서 안에서 종결 어미(합니다체·해요체·한다체)가 섞였습니다"
suggest = "문서 하나에 문체 하나 (문서 기본: 합니다체)"

[[rule]]
id = "ko-haeyo"
lang = "ko"
severity = "error"
pattern = '[가-힣](?<!니)(어요|아요|예요|에요|해요|돼요|죠|세요\?)[.?!]'
message = "해요체 문장 (문서 기본은 합니다체)"
suggest = "합니다체로: ~해요 → ~합니다, ~돼요 → ~됩니다 (해요체 제품 UI는 .style/rules.toml에서 이 규칙 해제)"
max_per_file = 2

[[rule]]
id = "ko-colloquial"
lang = "ko"
severity = "error"
pattern = '거예요|거에요|잖아요|잖습니까|해\s?줘요|해\s?드려요|\s딱\s|\s그냥\s|\s되게\s|엄청'
message = "구어체 표현"
suggest = "문서체로 교체 또는 삭제"

[[rule]]
id = "ko-personify"
lang = "ko"
severity = "error"
pattern = '(일|작업|업무)[이가]\s?(\S+\s)?흘러[가갑간갈]|알아서\s?(챙|처리|해)|일이\s?(돌아|굴러)|척척|술술|뚝딱'  # "데이터가 흘러가는" (data flow) is a technical term
message = "일·도구를 사람처럼 쓰는 구어 표현"
suggest = "주체와 동작 명시 (예: 워크플로가 라벨을 변경합니다)"

[[rule]]
id = "ko-reader-talk"
lang = "ko"
severity = "error"
pattern = '걱정하지\s?마세요|어렵지\s?않(아요|습니다)|한번\s?볼까요|살펴볼까요|함께\s?(알아|살펴)보|궁금하시죠'
message = "독자에게 말을 거는 문장"
suggest = "삭제, 바로 내용으로 시작"

# Added from an adversarial review of the ai-design page (structure-level tells in Korean prose).
[[rule]]
id = "ko-metaphor-verb"
lang = "ko"
severity = "warning"
pattern = '(걸러|덜어|녹여|담아|짚어)\s?(내|냅|낸|냈|낼)|덜어\s?(줍|주는|드립|드리)|(담았|녹였)습니다|녹아\s?있'
message = "동작을 비유 동사로 표현 ('걸러 냅니다', '덜어 줍니다', '담았습니다')"
suggest = "실제 동작 동사로 교체 (걸러 냅니다 → 검사하고 위치를 알립니다)"
max_per_file = 1

[[rule]]
id = "ko-universal-claim"
lang = "ko"
severity = "warning"
pattern = '어느\s?(프로젝트|팀|환경|회사|조직|서비스|제품|언어|도구|코드베이스|레포)(에나|에서나|이든|든지)|어디(에나|서나|든)\s?(붙|쓸|적용|도입)|어떤\s?(프로젝트|팀|환경|조직|서비스|제품|코드베이스|레포)(에도|에서도)\s?(붙|쓸|동작|적용|사용)'  # scope inside a system ("트리의 어느 위치에서나") is a fact
message = "근거 없는 범용 주장 ('어느 프로젝트에나')"
suggest = "실제 전제 조건으로 교체 (Python 3.11 이상, .md·.html·.tsx 파일)"

[[rule]]
id = "ko-reason-cleft"
lang = "ko"
severity = "warning"
pattern = '(이유|까닭)는\s[^.?!\n]{1,100}?때문(입니다|이다|이에요)[.]'
max_per_file = 2  # once or twice reads naturally in human docs; the tell is the repeated frame
message = "'~하는 이유는 ~때문입니다' 설명 구문"
suggest = "원인을 주어로 바로 서술 (기본값을 매번 새로 정해서 화면이 비슷해집니다), 근거 없는 인과는 삭제"

[[rule]]
id = "ko-paired-contrast"
lang = "ko"
severity = "warning"
pattern = '(?<![가-힣])[가-힣A-Za-z]+(은|는)\s[^,.\n]{1,30}?(으로|로|에만|만),\s[^,.\n]{0,15}?[가-힣A-Za-z]+(은|는|이면|으면)\s[^,.\n]{1,30}?(으로|로|에만|만)\s'
message = "'X는 A로, Y는 B로' 대칭 대구 반복"
suggest = "문장 하나에 사실 하나, 또는 표로 이동"
max_per_file = 1

[[rule]]
id = "ko-just-one"
lang = "ko"
severity = "warning"
pattern = '(?<=[가-힣A-Za-z0-9)])(?<!중)\s(하나|한\s가지)(로|가|를|만|뿐|입니다|\s|[.,)])'
message = "'X 하나' 단일성 강조 반복"
suggest = "수가 중요할 때만 유지 (합니다체 하나로 씁니다 → 합니다체로 씁니다)"
max_per_file = 4

# ───────────────────────── English prose ─────────────────────────

[[rule]]
id = "en-ai-vocabulary"
lang = "en"
severity = "error"
pattern = '\b(delve|tapestry|testament to|intricacies|meticulous(ly)?|showcas(e|es|ing)|underscor(e|es|ing)|pivotal|garner(s|ed)?|bolster(s|ed)?|vibrant|interplay|leverag(e|es|ed|ing)|synerg(y|ies|istic))\b'
message = "AI vocabulary"
suggest = "plain verb or the fact itself"

[[rule]]
id = "en-hype"
lang = "en"
severity = "error"
pattern = '\b(seamless(ly)?|cutting-edge|game-?chang(er|ing)|revolutioniz\w*|unleash\w*|supercharg\w*|best-in-class|world-class|next-gen(eration)?|unlock the (power|potential)|state-of-the-art|empower(s|ing)?)\b'
message = "Sales language"
suggest = "say what the user can do, with a number if you have one"

[[rule]]
id = "en-era-opener"
lang = "en"
severity = "error"
pattern = "In today's (fast-paced|digital|ever-evolving)|ever-evolving landscape|in the realm of"
message = "Era opener"
suggest = "cut; start with the fact"

[[rule]]
id = "en-run-up"
lang = "en"
severity = "error"
pattern = "\\bLet's (dive|explore|break it down)|Here's (what you need to know|the thing)|without further ado"
message = "Staged run-up"
suggest = "cut; start with the fact"

[[rule]]
id = "en-closer"
lang = "en"
severity = "error"
pattern = "(?m)^(In conclusion|In summary|Ultimately),|Let that sink in|That's the real (win|point)"
message = "Stock closer"
suggest = "end on the last fact"

[[rule]]
id = "en-chatbot-residue"
lang = "en"
severity = "error"
pattern = "I hope this helps|Great question|Certainly!|let me know if you|Would you like me to"
message = "Chatbot residue"
suggest = "delete"

[[rule]]
id = "en-inflation"
lang = "en"
severity = "error"
pattern = '\bplays an? (key|crucial|pivotal|vital) role|\bstands as an?\b|setting the stage for|the future looks bright'
message = "Significance inflation"
suggest = "state what changed, with a date or number"

[[rule]]
id = "en-filler-preface"
lang = "en"
severity = "error"
pattern = "(?i)\\bit(?: is|'s) (important|worth|crucial|essential) (to note|noting|to remember|to mention)\\b|\\bit should be noted that\\b"
message = "Filler preface"
suggest = "cut it; state the point"

[[rule]]
id = "en-buzzword"
lang = "en"
severity = "warning"
pattern = '\b(robust|holistic|comprehensive|streamlin(e|es|ed|ing)|elevat(e|es|ing) your)\b'
message = "Buzzword that names no property"
suggest = "the property itself: what it survives, covers or removes"

[[rule]]
id = "en-stacked-hedge"
lang = "en"
severity = "error"
pattern = '\b(could potentially|may possibly|might arguably)\b'
message = "Stacked hedge"
suggest = "one hedge at most"

[[rule]]
id = "en-is-avoidance"
lang = "en"
severity = "warning"
pattern = '\b(serves|stands|functions) as\b|\bboasts\b'
message = "Avoiding is/has"
suggest = "is / has"

[[rule]]
id = "en-ing-rider"
lang = "en"
severity = "warning"
pattern = ', (highlighting|underscoring|emphasizing|ensuring|reflecting|fostering|showcasing)\b'
message = "Trailing -ing rider"
suggest = "cut it, or name the mechanism"

[[rule]]
id = "en-filler-words"
lang = "en"
severity = "warning"
pattern = '\b(easily|simply|just|very|really)\b'
message = "Filler word"
suggest = "delete"
max_per_file = 3

[[rule]]
id = "en-vague-authority"
lang = "en"
severity = "warning"
pattern = '\b(experts|studies|research|industry reports?) (say|show|suggest|agree|believe)'
message = "Vague authority"
suggest = "cite the source or cut"

[[rule]]
id = "dash-overuse"
lang = "any"
severity = "warning"
pattern = '(?<!\|) [—–] (?!\|)'  # a dash alone in a table cell means "none" and is fine
message = "Em/en dash used as punctuation"
suggest = "쉼표, 콜론, 괄호 / comma, colon, parentheses"
max_per_file = 4

# ───────────────────────── UI markup (HTML/CSS/JSX/TSX) ─────────────────────────

[[rule]]
id = "ui-default-accent"
kind = "markup"
severity = "warning"
pattern = '\b(?:text|bg|border|ring|outline|decoration|fill|stroke|accent)-(?:indigo|violet|purple)-\d{2,3}\b'
message = "Tailwind indigo/violet used as the accent (the AI default)"
suggest = "the product's accent token"

[[rule]]
id = "ui-purple-gradient"
kind = "markup"
severity = "error"
pattern = '(from|via|to)-(indigo|violet|purple|fuchsia)-\d{3}|linear-gradient\([^)]*(#6366f1|#8b5cf6|#a855f7|#7c3aed|#4f46e5|indigo|violet|purple)'
message = "AI default purple/indigo gradient"
suggest = "use the product's color tokens; solid surfaces"

[[rule]]
id = "ui-gradient-text"
kind = "markup"
severity = "error"
pattern = 'bg-clip-text[^"\x27]*text-transparent|text-transparent[^"\x27]*bg-clip-text|background-clip:\s*text|-webkit-background-clip:\s*text'
message = "Gradient-filled text"
suggest = "one solid color; emphasize with size or weight"

[[rule]]
id = "ui-emoji-heading"
kind = "markup"
severity = "error"
pattern = '<(h[1-6]|button|a|li)\b[^>]*>\s*(?P<hit>[\U0001F300-\U0001FAFF✨⭐])'
message = "Emoji used as an icon in a heading, button, link or list item"
suggest = "SVG icon with aria-hidden, or nothing"

[[rule]]
id = "ui-fake-social-proof"
kind = "markup"
severity = "error"
pattern = '★★★★★|Trusted by\s+[\d,]+\+|\b(John Doe|Jane Doe|Acme Corp)\b|lorem ipsum'
message = "Placeholder or invented social proof"
suggest = "real quotes, logos and numbers only"

[[rule]]
id = "ui-no-zoom"
kind = "markup"
severity = "error"
pattern = 'user-scalable\s*=\s*(no|0)|maximum-scale\s*=\s*1(\.0)?\b'
message = "Pinch zoom disabled"
suggest = "remove; zoom is an accessibility need"

[[rule]]
id = "ui-outline-none"
kind = "markup"
severity = "warning"
pattern = 'outline-none|outline:\s*(none|0)\b'
message = "Focus outline removed"
suggest = "keep a visible :focus-visible style (2px ring with 3:1 contrast)"

[[rule]]
id = "ui-glass"
kind = "markup"
severity = "warning"
pattern = 'backdrop-blur|backdrop-filter:\s*blur'
message = "Glass blur used as decoration"
suggest = "only for real overlays (sticky nav, modal)"
max_per_file = 1

[[rule]]
id = "ui-glow"
kind = "markup"
severity = "warning"
pattern = 'shadow-\[0_0_\d+px|drop-shadow-\[[^\]]*(purple|indigo|cyan)|box-shadow:\s*0\s+0\s+\d{2,}px'
message = "Colored glow / halo"
suggest = "remove; use contrast and spacing"

[[rule]]
id = "ui-bounce"
kind = "markup"
severity = "warning"
pattern = 'animate-(bounce|ping)|cubic-bezier\([^)]*,\s*1\.[2-9]'
message = "Bounce / pulsing animation"
suggest = "ease-out 150–250 ms, and only where it explains a change"

[[rule]]
id = "ui-transition-all"
kind = "markup"
severity = "warning"
pattern = 'transition-all|transition:\s*all\b'
message = "transition: all"
suggest = "list the properties (opacity, transform)"

[[rule]]
id = "ui-hero-pill"
kind = "markup"
severity = "warning"
pattern = 'rounded-full[^>]*>\s*(New|Beta|Introducing|Now in beta|✨|NEW)'
message = "'New ✨' pill above a headline"
suggest = "put news in a changelog or banner"

[[rule]]
id = "ui-eyebrow-caps"
kind = "markup"
severity = "warning"
pattern = 'uppercase[^"\x27]*tracking-(wide|wider|widest)|text-transform:\s*uppercase'
message = "All-caps eyebrow labels"
suggest = "fold the label into the heading or remove it"
max_per_file = 2

[[rule]]
id = "ui-card-radius"
kind = "markup"
severity = "warning"
pattern = 'rounded-(2xl|3xl)|border-radius:\s*(1[6-9]|[2-9]\d)px'
message = "Large radius on everything (card kit)"
suggest = "a radius scale by size; 0–8 px for docs and dashboards"
max_per_file = 3

[[rule]]
id = "ui-arrow-chrome"
kind = "markup"
severity = "warning"
pattern = '→\s*</(a|button)>'
message = "Arrow appended to every link or button"
suggest = "a verb label that says what happens (API 키 발급)"
max_per_file = 2

[[rule]]
id = "ui-default-font"
kind = "markup"
severity = "warning"
pattern = 'font-family:\s*["\x27]?(Inter|Geist|Poppins)\b|next/font/google[^;]*\b(Inter|Poppins)\b'
message = "Default AI font choice"
suggest = "font-family: var(--font-sans) from the design tokens"

[[rule]]
id = "ui-raw-color"
kind = "markup"
severity = "warning"
pattern = '(?<![\w-])(?:color|background(?:-color)?|border(?:-(?:top|right|bottom|left))?(?:-color)?|outline(?:-color)?|fill|stroke|box-shadow|text-decoration-color|caret-color|accent-color)\s*:\s*[^;{}"\n]*?(?:#[0-9a-fA-F]{3,8}\b|\brgba?\(|\bhsla?\()|\b(?:bg|text|border|fill|stroke|ring|from|via|to)-\[#[0-9a-fA-F]{3,8}\]'
message = "Raw color outside the design tokens"
suggest = "var(--token) from the design system (default: polish-ui/design/tokens.css in ai-design); add a token if none fits"

[[rule]]
id = "ui-raw-font"
kind = "markup"
severity = "warning"
pattern = '(?<![\w-])font-family\s*:\s*(?!\s*(?:var\(|inherit|initial|unset))'
message = "Font stack outside the design tokens"
suggest = "font-family: var(--font-sans) or var(--font-mono)"

[[rule]]
id = "ui-section-number"
kind = "markup"
severity = "warning"
pattern = '<(span|div|p|small|b|strong|em|i)\b[^>]*>\s*0[1-9]\.?\s*</\1>|<(span|div)\b[^>]*class="(num|number|index|n)"[^>]*>\s*\d{1,2}\.?\s*</\2>'
message = "순서가 아닌 절·항목에 붙인 번호 (01, 02 …)"
suggest = "번호 삭제, 실제 순서면 ds-steps 사용"
max_per_file = 2

[[rule]]
id = "ui-table-min-width"
kind = "markup"
severity = "warning"
pattern = 'table[^{}]*\{[^}]*min-width:\s*([4-9]\d{2}|\d{4,})px'
message = "Table with a fixed min-width wider than a phone screen"
suggest = "turn a two-column table into a list (<dl>), or let it wrap; never wider than 375 px by force"
