message = "Performed candor"
suggest = "cut; state the claim"

[[rule]]
id = "en-to-be-clear"
lang = "en"
severity = "warning"
pattern = '(?m)(?:^\s*|(?<=[.!?]\s))(?:and |but )?to be (?:clear|fair)\s*[,:]'
message = "'To be clear' frame"
suggest = "cut it; state the point"

[[rule]]
id = "en-heres-the-catch"
lang = "en"
severity = "warning"
pattern = "\\bhere['’]?s (?:the )?(?:catch|deal|kicker|truth|reality|secret|problem though|tension|tradeoff|trade-off)\\b|\\bhere['’]?s what (?:i mean|most people|nobody|no one|everyone|many|few)\\b|\\bhere['’]?s why (?:this|that|it) matters\\b|\\bhere['’]?s what i find\\b"
